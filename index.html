<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMBO ROYALTY - INJIRA</title>
<style>
body {background:#000; color:white; font-family:Arial; margin:0; padding:20px;}
.orange{color:orange;}.green{color:#00FF00;}
.btn{background:orange; color:#000; padding:12px; border:none; border-radius:8px; width:100%; margin:5px 0; font-weight:bold; cursor:pointer; font-size:15px; text-align:center; text-decoration:none; display:block;}
.btn:hover{background:#ffaa00;}
.btn-green{background:#00FF00; color:#000;}
.card{background:#111; border:2px solid orange; padding:20px; border-radius:10px; margin-bottom:20px;}
input{padding:10px; width:90%; margin:5px 0; border-radius:5px; border:none; background:#222; color:white;}
.header{text-align:center; margin-bottom:20px;}
.footer{text-align:center; font-size:12px; color:#555; margin-top:20px;}
.tabs{display:flex; gap:10px; margin-bottom:15px;}
.tab-btn{flex:1; background:#222; color:white;}
.tab-btn.active{background:orange; color:#000;}
.error{color:red; font-size:12px; margin:5px 0;}
.success{color:#00FF00; font-size:12px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="header">
<h1 class="orange">👑 JUMBO ROYALTY 👑</h1>
<p>WIN BIG. PLAY SMART.</p>
</div>

<div class="card">
<h2 class="orange">IYANDIKISHE / INJIRA</h2>
<div class="tabs">
<button class="btn tab-btn active" onclick="showTab('login')">Ninjiye</button>
<button class="btn tab-btn" onclick="showTab('register')">Iyandikishe</button>
</div>

<div id="loginForm">
<input type="email" id="loginEmail" placeholder="Email yawe">
<input type="password" id="loginPass" placeholder="Ijambo ry'ibanga">
<p id="loginError" class="error"></p>
<button class="btn btn-green" onclick="login()">INJIRA</button>
</div>

<div id="registerForm" style="display:none;">
<input type="text" id="regName" placeholder="Amazina yawe">
<input type="email" id="regEmail" placeholder="Email yawe">
<input type="password" id="regPass" placeholder="Shiraho Ijambo ry'ibanga">
<input type="text" id="regPhone" placeholder="Numero ya MTN/Airtel">
<input type="text" id="regRef" placeholder="Code yo kwinjizwamo">
<p id="regError" class="error"></p>
<p id="regSuccess" class="success"></p>
<button class="btn btn-green" onclick="register()">IYANDIKISHE</button>
</div>
</div>

<script>
const SUPABASE_URL = 'https://grbltjhhjnvuiezhspau.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_BtR6Jq4m5sFQtYqbEFz0hQ_STkW3Oto'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

function showTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    if(tab=='login'){
        document.getElementById('loginForm').style.display='block';
        document.getElementById('registerForm').style.display='none';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
        document.getElementById('loginForm').style.display='none';
        document.getElementById('registerForm').style.display='block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
}

async function register(){
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const pass = document.getElementById("regPass").value;
    const ref = document.getElementById("regRef").value.trim();
    document.getElementById("regError").innerText = "";
    document.getElementById("regSuccess").innerText = "";
    if(!name ||!email ||!pass){ document.getElementById("regError").innerText = "Uzuza Amazina, Email na Password"; return; }
    document.getElementById("regError").innerText = "Turimo kubikora...";
    const { data, error } = await supabase.auth.signUp({ email: email, password: pass });
    if(error){ document.getElementById("regError").innerText = error.message; return; }
    await supabase.from('profiles').insert([{ id: data.user.id, email: email, username: name, phone: phone, referral_code: Math.random().toString(36).substring(2,8).toUpperCase(), referred_by: ref || null, balance: 0 }]);
    document.getElementById("regError").innerText = "";
    document.getElementById("regSuccess").innerText = "Wiyandikishije neza! Injira ubu.";
    showTab('login');
}

async function login(){
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPass").value;
    document.getElementById("loginError").innerText = "";
    if(!email ||!pass){ document.getElementById("loginError").innerText = "Injiza Email n'Ijambo ry'ibanga"; return; }
    document.getElementById("loginError").innerText = "Turimo kwinjira...";
    const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: pass });
    if(error){ document.getElementById("loginError").innerText = error.message; return; }
    window.location.href = `Dashboard.html?user=${data.user.id}`;
}
</script>
</body>
    </html>
