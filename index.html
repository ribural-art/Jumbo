<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMBO ROYALTY - INJIRA</title>
<style>
body {background:#000; color:white; font-family:Arial; margin:0; padding:20px;}
.orange{color:orange;}.green{color:#00FF00;}
.btn{background:orange; color:#000; padding:12px; border:none; border-radius:8px; width:100%; margin:5px 0; font-weight:bold; cursor:pointer; font-size:15px; text-align:center; text-decoration:none; display:block;}
.btn:hover{background:#ffaa00;}
.btn-green{background:#00FF00; color:#000;}
.card{background:#111; border:2px solid orange; padding:20px; border-radius:10px; margin-bottom:20px;}
input{padding:10px; width:90%; margin:5px 0; border-radius:5px; border:none; background:#222; color:white;}
.header{text-align:center; margin-bottom:20px;}
.footer{text-align:center; font-size:12px; color:#555; margin-top:20px;}
.rule-box {background:#1a1a1a; border-left:4px solid #00FF00; padding:12px; margin:10px 0; border-radius:5px;}
.tabs{display:flex; gap:10px; margin-bottom:15px;}
.tab-btn{flex:1; background:#222; color:white;}
.tab-btn.active{background:orange; color:#000;}
.error{color:red; font-size:12px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="header">
<h1 class="orange">👑 JUMBO ROYALTY 👑</h1>
<p>WIN BIG. PLAY SMART.</p>
</div>

<div class="card" id="authCard">
<h2 class="orange">IYANDIKISHE / INJIRA</h2>

<div class="tabs">
<button class="btn tab-btn active" onclick="showTab('login')">Ninjiye</button>
<button class="btn tab-btn" onclick="showTab('register')">Iyandikishe</button>
</div>

<div id="loginForm">
<input type="email" id="loginEmail" placeholder="Email yawe">
<input type="password" id="loginPass" placeholder="Ijambo ry'ibanga">
<p id="loginError" class="error"></p>
<button class="btn btn-green" onclick="login()">INJIRA</button>
</div>

<div id="registerForm" style="display:none;">
<input type="text" id="regName" placeholder="Amazina yawe">
<input type="email" id="regEmail" placeholder="Email yawe"> <!-- TWAHINDUIYE HANO -->
<input type="password" id="regPass" placeholder="Shiraho Ijambo ry'ibanga">
<input type="text" id="regPhone" placeholder="Numero ya MTN/Airtel"> <!-- TWAJYE TUZIBIKA NA YO -->
<input type="text" id="regRef" placeholder="Code yo kwinjizwamo - Ntiyemewe">
<p id="regError" class="error"></p>
<button class="btn btn-green" onclick="register()">IYANDIKISHE</button>
</div>

<p style="font-size:12px; margin-top:10px;"><a href="admin.html" style="color:gray;">Admin</a></p>
</div>

<div class="card">
<h2 class="orange">AMABWIRIZA YA JUMBO ROYALTY</h2>
<div class="rule-box">
<p>1. <b>4% buri munsi</b> iminsi 50. Win big, Play smart</p>
<p>2. <b>Tombola:</b> Buri munsi saa 23:00pm duhemba abantu 5 kuri buri Level</p>
</div>
<div class="footer">
<p>© 2026 JUMBO ROYALTY. +18 Gusa.</p>
</div>
</div>

<script>
// SHYIRAHO IYAWE YA SUPABASE HANO CEO
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.YOUR-ANON-KEY'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

function showTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    if(tab=='login'){
        document.getElementById('loginForm').style.display='block';
        document.getElementById('registerForm').style.display='none';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
        document.getElementById('loginForm').style.display='none';
        document.getElementById('registerForm').style.display='block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
}

async function register(){
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value; // EMAIL
    const phone = document.getElementById("regPhone").value; // NUMERO
    const pass = document.getElementById("regPass").value;
    const ref = document.getElementById("regRef").value;
    document.getElementById("regError").innerText = "";

    if(!name ||!email ||!pass){ alert("Uzuza Amazina, Email na Password"); return; }

    // 1. DUKOREA ACCOUNT MURI SUPABASE AUTH
    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: pass,
    });

    if(error){ document.getElementById("regError").innerText = error.message; return; }

    // 2. DUSHYIRA ANDI MAKURU MURI PROFILES TABLE
    await supabase.from('profiles').insert([{
        id: data.user.id,
        email: email,
        username: name,
        phone: phone, // DUBIKA NUMERO HANO
        referral_code: Math.random().toString(36).substring(2,8).toUpperCase(),
        referred_by: ref,
        balance: 0
    }]);

    alert("Wiyandikishije neza! Noneho injira");
    showTab('login');
}

async function login(){
    const email = document.getElementById("loginEmail").value; // EMAIL
    const pass = document.getElementById("loginPass").value;
    document.getElementById("loginError").innerText = "";

    if(!email ||!pass){ alert("Injiza Email n'Ijambo ry'ibanga"); return; }

    // DUKORESHEJE SUPABASE AUTH
    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: pass,
    });

    if(error){ document.getElementById("loginError").innerText = error.message; return; }

    // TUYOHEREZA MURI DASHBOARD IFITE USER ID
    window.location.href = `Dashboard.html?user=${data.user.id}`;
}
</script>
</body>
    </html>
