<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>JUMBO ROYALTY - Deposit</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body{background:#0a0a0a; color:#fff;}
        .header{background:linear-gradient(90deg, #FFD700, #FFA500); padding:20px; color:#000; font-weight:bold; font-size:20px; display:flex; justify-content:space-between;}
        .header a{color:#000; text-decoration:none;}
        .container{padding:20px; max-width:500px; margin:auto;}
        .card{background:#1a1a1a; border:2px solid #FFD700; border-radius:15px; padding:20px; margin-top:20px;}
        .card h3{color:#FFD700; text-align:center; margin-bottom:15px;}
        .payment-box{background:#111; border:2px solid #00FF00; padding:15px; border-radius:10px; margin:15px 0; text-align:center;}
        .payment-box p{color:#00FF00; font-weight:bold; font-size:16px; margin:5px 0;}
        .warning{background:#330000; border:1px solid #FF4444; padding:15px; border-radius:10px; margin:15px 0;}
        .warning h4{color:#FF4444; margin-bottom:8px;}
        .warning p{font-size:12px; margin:5px 0;}
        input, select{width:100%; padding:12px; border-radius:8px; border:none; margin:8px 0; background:#333; color:#fff;}
        .btn{background:#FFD700; color:#000; padding:14px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:100%; margin-top:15px; font-size:16px;}
        .btn:disabled{background:#555;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="header">
        <a href="investment.html">⬅ Gusubira Inyuma</a>
        📤 Deposit
    </div>
    <div class="container">
        <div class="card">
            <h3 id="planTitle">Uragura Plan</h3>
            <div class="payment-box">
                <p>KWISHYURA</p>
                <p>*182*8*1*2169779#</p>
                <p>Izina: Rachel</p>
            </div>
            <select id="method" required>
                <option value="">Hitamo Uburyo</option>
                <option value="MTN Mobile Money">MTN Mobile Money</option>
                <option value="Airtel Money">Airtel Money</option>
            </select>
            <input type="text" id="tef" placeholder="Transaction ID / Ref" required>
            <input type="number" id="amount" placeholder="Amafaranga" required>
            <button class="btn" onclick="sendDeposit()">Ohereza Kuri Admin</button>
        </div>
    </div>

<script>
// === KEYS ZIKOSOYE ===
const SUPABASE_URL = 'https://grbltjhhjnvuiezhspau.supabase.co'
const SUPABASE_KEY = 'sb_publishable_BtR6Jq4m5sFQtYqbEFz0hQ_STkW3Oto'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const urlParams = new URLSearchParams(window.location.search);
const plan = urlParams.get('plan');
const amountParam = urlParams.get('amount');
if(plan && amountParam){
    document.getElementById("planTitle").innerText = `Uragura: ${plan} - ${amountParam} Frw`;
    document.getElementById("amount").value = amountParam;
}

async function sendDeposit(){
    const { data: { user } } = await supabase.auth.getUser();
    
    if(!user){ 
        alert("Banza winjire CEO"); 
        window.location='index.html'; 
        return; 
    }

    let method = document.getElementById('method').value;
    let tef = document.getElementById('tef').value;
    let amount = document.getElementById('amount').value;

    if(method == "" || tef == "" || amount == ""){
        alert("Uzuza byose CEO");
        return;
    }

    document.querySelector('.btn').disabled = true;
    document.querySelector('.btn').innerText = "Ohereza...";

    const { error } = await supabase.from('deposits').insert([{
        user_id: user.id,
        amount: Number(amount),
        method: method,
        tef: tef,
        status: 'pending',
        phone: user.email
    }])

    if(error){ 
        alert("Byanze: " + error.message);
        document.querySelector('.btn').disabled = false;
        document.querySelector('.btn').innerText = "Ohereza Kuri Admin";
    } else { 
        alert("Deposit yoherejwe! Admin azayemeza.");
        window.location = 'dashboard.html';
    }
}
</script>
</body>
                                               </html>
