<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>JUMBO ROYALTY - Dashboard</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body{background:#0a0a0a; color:#fff;}
      .navbar{background:#111; padding:15px 20px; border-bottom:2px solid #FFD700; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100;}
      .navbar .logo{color:#FFD700; font-weight:bold;}
      .navbar .links a{color:#fff; text-decoration:none; margin:0 12px; font-size:14px;}
      .navbar .logout{color:#ff4444; cursor:pointer;}
      .header{background:linear-gradient(90deg, #FFD700, #FFA500); padding:20px; color:#000; font-weight:bold; font-size:20px; text-align:center;}
      .container{padding:20px; max-width:1200px; margin:auto;}
      .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:20px;}
      .card{background:#1a1a1a; border:1px solid #FFD700; border-radius:15px; padding:20px;}
      .card h3{color:#FFD700; margin-bottom:10px;}
      .balance{font-size:32px; font-weight:bold; color:#00FF00;}
      .btn{background:#FFD700; color:#000; padding:12px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;}
      .btn2{background:#333; color:#FFD700; padding:12px 20px; border:1px solid #FFD700; border-radius:10px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;}
      input, select{width:100%; padding:10px; border-radius:8px; border:none; margin:8px 0; background:#222; color:#fff;}
      .ref-box{background:#222; padding:10px; border-radius:8px; margin-top:10px; font-size:12px; word-break:break-all; border:1px dashed #FFD700;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="navbar">
        <div class="logo">👑 JUMBO ROYALTY</div>
        <div class="links">
            <a href="dashboard.html">Dashboard</a>
            <a href="deposit.html">Deposit</a>
            <a href="investment.html">Investment</a>
            <a href="tombola.html">Tombola</a>
            <a href="admin.html">Admin</a>
        </div>
        <div class="logout" onclick="logout()">Gusohoka</div>
    </div>

    <div class="header">Welcome CEO <span id="username">...</span></div>

    <div class="container">
        <div class="cards">
            <div class="card">
                <h3>💰 Amafaranga Yanjye</h3>
                <p class="balance" id="balance">0 Frw</p>
                <button class="btn" onclick="window.location='investment.html'">Tangira Investment</button>
            </div>
            <div class="card">
                <h3>📤 Kohereza Deposit</h3>
                <select id="method">
                    <option>Hitamo Uburyo</option>
                    <option>MTN Mobile Money</option>
                    <option>Airtel Money</option>
                </select>
                <input type="number" id="amount" placeholder="Amafaranga">
                <input type="text" id="tef" placeholder="Transaction ID">
                <button class="btn2" onclick="sendDeposit()">Ohereza Deposit</button>
            </div>
            <div class="card">
                <h3>👥 Referral Bonus</h3>
                <p>Link yawe:</p>
                <div class="ref-box" id="refLink">Loading...</div>
                <button class="btn2" onclick="copyRef()">Koporora Link</button>
            </div>
        </div>
    </div>

<script>
// === KEYS ZIKOSOYE - NSHYA ===
const SUPABASE_URL = 'https://grbltjhhjnvuiezhspau.supabase.co'
const SUPABASE_KEY = 'sb_publishable_BtR6Jq4m5sFQtYqbEFz0hQ_STkW3Oto'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let currentUserId = null;

async function checkLogin(){
    const { data: { user } } = await supabase.auth.getUser();
    
    if(!user){
        window.location = 'index.html'
        return;
    }
    currentUserId = user.id;
    loadUserData()
    generateRefLink(currentUserId)
}

async function loadUserData(){
    const { data, error } = await supabase.from('profiles').select('*').eq('id', currentUserId).single()
    if(error || !data){
        console.log(error);
        return;
    }
    document.getElementById('username').innerText = data.username || data.email
    document.getElementById('balance').innerText = Number(data.balance || 0).toLocaleString() + ' Frw'
}

async function sendDeposit(){
    let amount = document.getElementById('amount').value;
    let method = document.getElementById('method').value;
    let tef = document.getElementById('tef').value;

    if(amount == "" || tef == ""){
        alert("Uzuza byose");
        return;
    }

    const { error } = await supabase.from('deposits').insert([{
        user_id: currentUserId, 
        amount: Number(amount),
        method: method,
        tef: tef,
        status: 'pending',
        phone: method
    }])

    if(error){ alert("Byanze: " + error.message) }
    else { alert("Deposit yoherejwe!"); }
}

function generateRefLink(userId){
    let link = `https://jumbo-royalty.vercel.app/?ref=${userId}`
    document.getElementById('refLink').innerText = link
}
function copyRef(){
    navigator.clipboard.writeText(document.getElementById('refLink').innerText)
    alert("Link ikoporowe!")
}
async function logout(){
    await supabase.auth.signOut()
    window.location = 'index.html'
}
checkLogin();
</script>
</body>
                </html>
