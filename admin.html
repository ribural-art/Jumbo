<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBO ROYALTY - Admin PRO</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body{background:#0a0a0a; color:#fff;}
       .top-header{background:linear-gradient(90deg, #FFD700, #FFA500); color:#000; padding:15px; text-align:center; border-bottom:4px solid #000; position:sticky; top:0; z-index:100;}
       .top-header h1{font-size:18px; font-weight:900;}
       .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:15px 0; padding:15px;}
       .stat-card{background:#1a1a1a; border:1px solid #FFD700; padding:12px; border-radius:10px; text-align:center;}
       .stat-card h4{color:#aaa; font-size:11px;}
       .stat-card p{color:#FFD700; font-size:18px; font-weight:bold; margin-top:5px;}
       .tabs{display:flex; gap:8px; margin:15px; overflow-x:auto; padding-bottom:5px;}
       .tab{background:#222; padding:10px 12px; border-radius:8px; cursor:pointer; border:1px solid #333; font-size:11px; white-space:nowrap;}
       .tab.active{background:#FFD700; color:#000; font-weight:bold;}
       .card{background:#1a1a1a; border-left:4px solid #FFA500; border-radius:10px; padding:12px; margin:10px 15px;}
       .card.withdraw{border-left:4px solid #FF4444;}
       .card.deposit{border-left:4px solid #00FF00;}
       .card.user-card{border-left:4px solid #0088FF;}
       .info p{margin:4px 0; font-size:12px;}
       .info b{color:#FFD700;}
       .btn-group{display:flex; gap:8px; margin-top:10px;}
       .btn-approve{background:#00FF00; color:#000; padding:10px; border:none; border-radius:6px; font-weight:bold; width:50%; cursor:pointer;}
       .btn-reject{background:#FF4444; color:#fff; padding:10px; border:none; border-radius:6px; font-weight:bold; width:50%; cursor:pointer;}
       .logout{background:#FF4444; color:#fff; padding:8px 12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; float:right; margin:15px;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="top-header">
        <div class="logo">👑</div>
        <h1>JUMBO ROYALTY ADMIN PANEL</h1>
        <button class="logout" onclick="logout()">SOHOKA</button>
    </div>

    <div class="stats">
        <div class="stat-card"><h4>Abakoresha Bose</h4><p id="totalUsers">0</p></div>
        <div class="stat-card"><h4>Deposit Zose</h4><p id="totalDeposit">0 Frw</p></div>
        <div class="stat-card"><h4>Withdraw Zose</h4><p id="totalWithdraw">0 Frw</p></div>
        <div class="stat-card"><h4>Balance Yose</h4><p id="totalBalance">0 Frw</p></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('deposit', this)">Deposits</div>
        <div class="tab" onclick="showTab('withdraw', this)">Withdraws</div>
        <div class="tab" onclick="showTab('users', this)">Abakoresha</div>
    </div>

    <div id="depositTab"></div>
    <div id="withdrawTab" style="display:none;"></div>
    <div id="usersTab" style="display:none;"></div>

<script>
// AMAFARANGA YA SUPABASE YAWE
const SUPABASE_URL = 'https://grbltjhhjnvuiezhspau.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyYmx0amhoam52dWllemhzcGF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NjgyNTEsImV4cCI6MjEwNDI0NDI1MX0.5Jj0uW7gJiatdIh4KMA7kxOnA9AmDBYEbWxSiBpCME8'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

loadStats();
loadDeposits();

function showTab(tab, el){
    ['depositTab','withdrawTab','usersTab'].forEach(id=>document.getElementById(id).style.display='none');
    document.getElementById(tab+'Tab').style.display = 'block';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if(tab === 'users'){ loadUsers(); }
    if(tab === 'withdraw'){ loadWithdraws(); }
}

async function loadStats(){
    const { count: userCount } = await supabase.from('profiles').select('*', {count: 'exact', head: true})
    const { data: profiles } = await supabase.from('profiles').select('balance')
    const { data: deposits } = await supabase.from('deposits').select('amount').eq('status', 'approved')
    const { data: withdrawals } = await supabase.from('withdrawals').select('amount').eq('status', 'approved')
    
    let totalBalance = profiles?.reduce((a,b)=>a+b.balance,0) || 0
    let totalDep = deposits?.reduce((a,b)=>a+b.amount,0) || 0
    let totalWith = withdrawals?.reduce((a,b)=>a+b.amount,0) || 0
    
    document.getElementById('totalUsers').innerText = userCount
    document.getElementById('totalBalance').innerText = totalBalance.toLocaleString() + ' Frw'
    document.getElementById('totalDeposit').innerText = totalDep.toLocaleString() + ' Frw'
    document.getElementById('totalWithdraw').innerText = totalWith.toLocaleString() + ' Frw'
}

async function loadDeposits(){
    const { data } = await supabase.from('deposits').select('*, profiles(username, email, phone)').eq('status','pending').order('created_at', {ascending:false})
    let html = '';
    if(data.length === 0) html = '<p style="text-align:center; padding:20px;">Nta Deposit bitegereje</p>'
    data.forEach(d => {
        html += `<div class="card deposit"><div class="info">
            <p><b>Izina:</b> ${d.profiles?.username} | <b>Email:</b> ${d.profiles?.email}</p>
            <p><b>Tel:</b> ${d.profiles?.phone} | <b>Uburyo:</b> ${d.method}</p>
            <p><b>Transaction ID:</b> ${d.tef}</p>
            <p><b>Amafaranga:</b> ${Number(d.amount).toLocaleString()} Frw</p>
            </div><div class="btn-group">
            <button class="btn-approve" onclick="approveDeposit('${d.id}', ${d.amount}, '${d.user_id}')">EMEZA</button>
            <button class="btn-reject" onclick="rejectDeposit('${d.id}')">ANZA</button>
            </div></div>`
    })
    document.getElementById('depositTab').innerHTML = html;
}

async function approveDeposit(id, amount, user_id){
    // 1. Hindura status
    await supabase.from('deposits').update({status:'approved'}).eq('id',id)
    // 2. Ongera amafaranga kuri balance
    const {data} = await supabase.from('profiles').select('balance').eq('id',user_id).single()
    let newBalance = Number(data.balance) + Number(amount)
    await supabase.from('profiles').update({balance:newBalance}).eq('id',user_id)
    alert("Deposit Yemejwe!")
    loadDeposits(); loadStats();
}

async function rejectDeposit(id){
    await supabase.from('deposits').update({status:'rejected'}).eq('id',id)
    alert("Deposit Yanwe!")
    loadDeposits();
}

async function loadWithdraws(){
    const { data } = await supabase.from('withdrawals').select('*, profiles(username, email, phone)').eq('status','pending').order('created_at', {ascending:false})
    let html = '';
    if(data.length === 0) html = '<p style="text-align:center; padding:20px;">Nta Withdraw bitegereje</p>'
    data.forEach(w => {
        html += `<div class="card withdraw"><div class="info">
            <p><b>Izina:</b> ${w.profiles?.username} | <b>Email:</b> ${w.profiles?.email}</p>
            <p><b>Tel:</b> ${w.profiles?.phone}</p>
            <p><b>Kubikuza:</b> ${Number(w.amount).toLocaleString()} Frw</p>
            </div><div class="btn-group">
            <button class="btn-approve" onclick="approveWithdraw('${w.id}', ${w.amount}, '${w.user_id}')">OHEREZA</button>
            <button class="btn-reject" onclick="rejectWithdraw('${w.id}')">ANZA</button>
            </div></div>`
    })
    document.getElementById('withdrawTab').innerHTML = html;
}

async function approveWithdraw(id, amount, user_id){
    await supabase.from('withdrawals').update({status:'approved'}).eq('id',id)
    const {data} = await supabase.from('profiles').select('balance').eq('id',user_id).single()
    let newBalance = Number(data.balance) - Number(amount)
    await supabase.from('profiles').update({balance:newBalance}).eq('id',user_id)
    alert("Withdraw Yemejwe!")
    loadWithdraws(); loadStats();
}

async function rejectWithdraw(id){
    await supabase.from('withdrawals').update({status:'rejected'}).eq('id',id)
    alert("Withdraw Yanwe!")
    loadWithdraws();
}

async function loadUsers(){
    const { data } = await supabase.from('profiles').select('*').order('created_at', {ascending:false})
    let html = '';
    data.forEach((u,i) => {
        html += `<div class="card user-card"><div class="info">
            <p><b>#${i+1} Izina:</b> ${u.username}</p>
            <p><b>Email:</b> ${u.email}</p>
            <p><b>Tel:</b> ${u.phone}</p>
            <p><b>Balance:</b> ${Number(u.balance).toLocaleString()} Frw | <b>Level:</b> ${u.level}</p>
            </div></div>`
    })
    document.getElementById('usersTab').innerHTML = html;
}

function logout(){ window.location = 'index.html' }
</script>
</body>
        </html>
